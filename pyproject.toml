[project]
name = "agentic-ai-infrastructure"
version = "0.1.0"
description = "Reference multi-agent system showing MCP, A2A and AG-UI working together"
readme = "README.md"
authors = [
    { name = "Rico Gross" }
]
requires-python = ">=3.14"
dependencies = [
    "a2a-sdk[http-server]>=1.3.0",
    "httpx>=0.28.1",
    "langchain-mcp-adapters>=0.3.2",
    "langchain[openai]>=1.5.0",
    "langgraph>=1.2.22",
    "langgraph-cli[inmem]>=0.4.43",
    "mcp[cli]>=1.30.0,<2",
    "python-dotenv>=1.2.4",
]

[project.scripts]
seed-db = "agentic_ai_infrastructure.seed_db:main"
sqlite-mcp-server = "agentic_ai_infrastructure.sqlite_mcp_server:main"
database-agent = "agentic_ai_infrastructure.a2a_database_agent:main"
filesystem-agent = "agentic_ai_infrastructure.a2a_filesystem_agent:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff==0.17.1",
    "ty==0.0.89",
]

[tool.ruff]
# Cache outside the repo. Safe to share: Ruff splits it per version and per project.
cache-dir = "~/.cache/ruff"
line-length = 100

[tool.ruff.lint]
extend-select = [
    "S", # security checks
]
ignore = []

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
indent-style = "space"
