[project]
name = "agentic-ai-infrastructure"
version = "0.1.0"
description = "Reference multi-agent system showing MCP, A2A and AG-UI working together"
readme = "README.md"
authors = [
    { name = "Rico Gross" }
]
requires-python = ">=3.14"
dependencies = [
    "a2a-sdk[http-server]==0.3.24",
    "httpx==0.28.1",
    "langchain-mcp-adapters==0.2.1",
    "langchain[openai]==1.2.10",
    "langgraph==1.0.9",
    "langgraph-cli[inmem]==0.4.12",
    "mcp[cli]==1.26.0",
    "openai==2.24.0",
    "python-dotenv==1.1.1",
]

[project.scripts]
seed-db = "agentic_ai_infrastructure.seed_db:main"
sqlite-mcp-server = "agentic_ai_infrastructure.sqlite_mcp_server:main"
database-agent = "agentic_ai_infrastructure.a2a_database_agent:main"
filesystem-agent = "agentic_ai_infrastructure.a2a_filesystem_agent:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff==0.17.1",
    "ty==0.0.89",
]

[tool.uv]
# Resolve sub-dependencies as they were at the seminar submission, so the old pins
# get compatible versions. Remove this when upgrading the dependencies.
exclude-newer = "2026-03-26T00:00:00Z"
# Dev tools are exempt: they should be current, not from March 2026.
exclude-newer-package = { pre-commit = false, ruff = false, ty = false }

[tool.ruff]
# Cache outside the repo. Safe to share: Ruff splits it per version and per project.
cache-dir = "~/.cache/ruff"
line-length = 100

[tool.ruff.lint]
extend-select = [
    "S", # security checks
]
ignore = []

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
indent-style = "space"
